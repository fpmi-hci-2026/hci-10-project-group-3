# Локальный SonarQube для проверки backend и web.
# Запуск: docker compose -f infra/sonarqube/docker-compose.yml up -d, затем http://localhost:9000 (admin/admin).
name: pinkmine-sonar

services:
  sonarqube:
    image: sonarqube:10.6-community
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
