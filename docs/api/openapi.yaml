          required: [commentCount, attachmentCount, projectArchived]
          properties:
            commentCount:
              type: integer
              minimum: 0
            attachmentCount:
              type: integer
              minimum: 0
            projectArchived:
              type: boolean
              description: true — клиент скрывает кнопки изменения
    TaskPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
    TaskCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
          nullable: true
        type:
