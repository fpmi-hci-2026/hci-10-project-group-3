      properties:
        assigneeId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        version:
          type: integer
          format: int32
          minimum: 1
    TaskDeadlineUpdate:
      type: object
      additionalProperties: false
      required: [dueDate, version]
      properties:
        dueDate:
          type: string
          format: date
          nullable: true
        version:
          type: integer
          format: int32
          minimum: 1
    HistoryEntry:
      type: object
      required: [id, taskVersion, author, field, oldValue, newValue, reasonCommentId, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        taskVersion:
          type: integer
          format: int32
