          $ref: '#/components/schemas/UserShort'
        field:
          type: string
          enum: [title, description, status, type, assignee, due_date]
        oldValue:
          type: string
          nullable: true
        newValue:
          type: string
          nullable: true
        reasonCommentId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
    Comment:
