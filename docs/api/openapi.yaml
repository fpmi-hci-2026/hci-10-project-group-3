      properties:
        tagIds:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/Id'
    Task:
      type: object
      required: [id, projectId, title, description, status, type, author, assignee, dueDate, overdue, tags, version, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatusCode'
        type:
