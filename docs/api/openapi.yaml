  /api/tasks/{taskId}/status:
    patch:
      tags: [tasks]
      operationId: changeTaskStatus
      summary: Изменить статус задачи
      description: |
        UC-T3, UC-T4, UC-T14. Постановка метода из ЛР3 (срезы S9, S11, S12, S17 Event Modeling).
        - closed выставляет только пользователь с правом task.close (H2, FR-29);
        - review → in_progress (возврат на доработку) требует `reasonCommentId` (US-8.4, FR-38);
        - задачи архивного проекта не изменяются (FR-19);
        - повтор уже применённого запроса возвращает 200 без изменений (идемпотентность офлайн-очереди, H3).
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStatusUpdate'
            examples:
              takeToWork:
                summary: Взять задачу в работу
                value:
                  status: in_progress
                  version: 3
              returnToWork:
                summary: Вернуть на доработку с комментарием
                value:
                  status: in_progress
                  version: 5
                  reasonCommentId: 118
      responses:
        '200':
          description: Статус изменён или уже совпадает с запрошенным
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResult'
              example:
                id: 42
                projectId: 7
                status: in_progress
                version: 4
                updatedAt: '2026-10-14T07:12:03Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                closeForbidden:
                  value:
                    errorCode: TASK_CLOSE_FORBIDDEN
                    message: Закрыть задачу может менеджер проекта
                    details: []
                    traceId: 0c4d1e2a-5b7f-4d1c-9a3e-6f2b8c9d0e1f
                statusChangeForbidden:
                  value:
                    errorCode: STATUS_CHANGE_FORBIDDEN
                    message: Недостаточно прав для изменения статуса
                    details: []
                    traceId: 3a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/TaskConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Нет корректного комментария с причиной возврата
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                reasonRequired:
                  value:
                    errorCode: REASON_COMMENT_REQUIRED
                    message: Укажите комментарий с причиной возврата
                    details: [{field: reasonCommentId, reason: REQUIRED_FOR_RETURN_TO_WORK}]
                    traceId: 7d6c5b4a-3f2e-4d1c-8b9a-0f1e2d3c4b5a
                reasonInvalid:
                  value:
                    errorCode: REASON_COMMENT_INVALID
                    message: Комментарий с причиной не найден в этой задаче
                    details: [{field: reasonCommentId, reason: NOT_IN_TASK}]
                    traceId: 8e7d6c5b-4a3f-4e2d-9c1b-0a1f2e3d4c5b
        '500':
          $ref: '#/components/responses/InternalError'
