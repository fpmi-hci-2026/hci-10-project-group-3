      description: "UC-T1. Актор: менеджер проекта, участник команды (право task.create). Задача получает статус new и version 1 (FR-24). Исполнитель только из участников проекта (FR-22), срок не в прошлом (FR-23). Назначение исполнителя и срока при создании требует прав task.assign и task.set_due_date (FR-25)."
