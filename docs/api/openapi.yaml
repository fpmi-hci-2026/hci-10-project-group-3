          in: query
          schema:
            type: string
            format: date
        - name: dueTo
          in: query
          schema:
            type: string
            format: date
        - name: overdue
          in: query
          description: Только просроченные (срок прошёл, статус не done и не closed, FR-51)
          schema:
            type: boolean
