            - $ref: '#/components/schemas/TaskTypeCode'
          default: task
        assigneeId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        tagIds:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/Id'
    TaskUpdate:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
          nullable: true
        type:
          $ref: '#/components/schemas/TaskTypeCode'
        version:
          type: integer
          format: int32
          minimum: 1
    TaskStatusUpdate:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
