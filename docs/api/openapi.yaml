              example:
                id: 15
                platform: android
                createdAt: '2026-10-21T09:00:00Z'
                lastSeenAt: '2026-10-21T09:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
