openapi: 3.0.3
info:
  title: Pinkmine API
  version: 1.0.0
  description: |
    REST API системы управления проектами Pinkmine (веб-клиент, Android-приложение на Flutter, сервер на Python и Flask).

    Спецификация построена по модели требований (задание 1), физической модели данных PostgreSQL (задание 2)
    и таблице «вариант использования → конечная точка» (задание 3) лабораторной работы № 4.

    Общие соглашения:
    - JSON в формате camelCase, коды статусов и типов задач в нижнем регистре (`in_progress`);
    - все методы, кроме регистрации, входа, подтверждения email, сброса пароля и просмотра приглашения, требуют `Authorization: Bearer <token>`;
    - ошибка всегда возвращается объектом `Error` с полями `errorCode`, `message`, `details`, `traceId`;
    - доступ к объектам чужих проектов отвечает 404, не раскрывая их существование;
    - изменения задачи передают `version` (оптимистическая блокировка, противоречие H3), при расхождении сервер отвечает 409 и возвращает актуальное состояние задачи;
    - задачи архивного проекта доступны только для чтения (409 `PROJECT_ARCHIVED`).
  contact:
    name: Команда Pinkmine (группа 10, ФПМИ БГУ)
    url: https://github.com/fpmi-hci-2026/hci-10-project-group-3
servers:
  - url: http://localhost:4010
    description: Локальный mock-сервер (mock/mock_server.py)
  - url: http://localhost:5000
    description: Локальный сервер Flask
tags:
  - name: auth
    description: Регистрация, вход, подтверждение email, восстановление пароля
  - name: profile
    description: Профиль текущего пользователя и справочники
  - name: roles
    description: Глобальные роли и права (администратор системы)
  - name: projects
    description: Проекты и архив
  - name: members
    description: Команда проекта и поиск пользователей
  - name: invites
    description: Приглашения по email
  - name: tasks
    description: Задачи, статусы, исполнитель, срок, история
  - name: comments
    description: Обсуждение задачи
  - name: attachments
    description: Вложения задачи
  - name: tags
    description: Теги проекта
  - name: notifications
    description: Лента уведомлений и токены устройств
security:
  - bearerAuth: []
paths:
  /api/auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: Зарегистрироваться
      description: "UC-A1. Актор: новый пользователь. После регистрации отправляется письмо подтверждения email (FR-04), вход разрешён и до подтверждения. Если передан `inviteToken`, пользователь сразу становится участником проекта из приглашения (FR-17)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              login: ryan
              email: ryan@pinkmine.by
              password: Secret-2026
              firstName: Райан
              lastName: Мельник
      responses:
        '201':
          description: Учётная запись создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 12
                login: ryan
                email: ryan@pinkmine.by
                firstName: Райан
                lastName: Мельник
                role: member
                emailConfirmed: false
                permissions: [task.create, task.change_status, comment.create]
                createdAt: '2026-10-21T09:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Логин или email уже заняты (FR-02)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emailTaken:
                  value:
                    errorCode: EMAIL_TAKEN
                    message: Этот email уже используется
                    details: [{field: email, reason: NOT_UNIQUE}]
                    traceId: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
                loginTaken:
                  value:
                    errorCode: LOGIN_TAKEN
                    message: Этот логин уже занят
                    details: [{field: login, reason: NOT_UNIQUE}]
                    traceId: 7a2b3c4d-5e6f-4a70-8b9c-0d1e2f3a4b5c
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Токен приглашения недействителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errorCode: INVITE_INVALID
                message: Приглашение недействительно, обратитесь к менеджеру проекта
                details: [{field: inviteToken, reason: EXPIRED_OR_REVOKED}]
                traceId: 8b3c4d5e-6f70-4a81-9c0d-1e2f3a4b5c6d
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/email/confirm:
    post:
      tags: [auth]
      operationId: confirmEmail
      summary: Подтвердить email
      description: "UC-A2. Актор: новый пользователь. Токен из письма одноразовый и ограничен по времени."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              token: q8Zt1mVYc3n0XkR4bP7wHs
      responses:
        '200':
          description: Email подтверждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailConfirmResult'
              example:
                emailConfirmed: true
                emailConfirmedAt: '2026-10-21T09:05:12Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/TokenInvalid'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Войти в систему
      description: "UC-A3. Актор: участник команды, менеджер проекта, администратор. Выдаёт JWT-токен доступа (FR-05)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: jessica
              password: Secret-2026
      responses:
        '200':
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMSJ9.signature
                tokenType: Bearer
                expiresIn: 3600
                user:
                  id: 11
                  login: jessica
                  email: jessica@pinkmine.by
                  firstName: Джесика
                  lastName: Ковалёва
                  role: manager
                  emailConfirmed: true
                  permissions: [project.create, project.archive, member.add, member.remove, task.create, task.assign, task.set_due_date, task.change_status, task.review, task.close, comment.create]
                  createdAt: '2026-09-01T08:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errorCode: INVALID_CREDENTIALS
                message: Неверный логин или пароль
                details: []
                traceId: 9c4d5e6f-7081-4a92-8d1e-2f3a4b5c6d7e
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выйти из системы
      description: "UC-A4. Токен доступа вносится в список отозванных."
      responses:
        '204':
          description: Выход выполнен
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Запросить сброс пароля
      description: "UC-A5. Ответ одинаковый независимо от того, зарегистрирован ли адрес (FR-06)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
            example:
              email: ryan@pinkmine.by
      responses:
        '202':
          description: Запрос принят, письмо отправляется, если адрес зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
              example:
                message: Если адрес зарегистрирован, на него отправлено письмо со ссылкой для сброса пароля
        '400':
          $ref: '#/components/responses/ValidationError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Задать новый пароль
      description: "UC-A6. Ссылка одноразовая; после смены пароля все активные сессии пользователя завершаются (FR-07)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: u2Hc9LmQe5tYvB1sN8kD0a
              newPassword: NewSecret-2026
      responses:
        '204':
          description: Пароль изменён
        '400':
          $ref: '#/components/responses/ValidationError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/TokenInvalid'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me:
    get:
      tags: [profile]
      operationId: getMe
      summary: Получить профиль текущего пользователя
      description: "UC-A9. Профиль, глобальная роль и права для отображения доступных действий (FR-09)."
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 12
                login: ryan
                email: ryan@pinkmine.by
                firstName: Райан
                lastName: Мельник
                role: member
                emailConfirmed: true
                permissions: [task.create, task.change_status, comment.create]
                createdAt: '2026-09-01T08:10:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/dictionaries:
    get:
      tags: [profile]
      operationId: getDictionaries
      summary: Получить справочники
      description: "UC-A9. Статусы и типы задач, роли (таблицы task_statuses, task_types, roles)."
      responses:
        '200':
          description: Справочники
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dictionaries'
              example:
                taskStatuses:
                  - {code: new, name: Новая, sortOrder: 1, isCompleted: false}
                  - {code: in_progress, name: В работе, sortOrder: 2, isCompleted: false}
                  - {code: review, name: На проверке, sortOrder: 3, isCompleted: false}
                  - {code: postponed, name: Отложена, sortOrder: 4, isCompleted: false}
                  - {code: done, name: Готова, sortOrder: 5, isCompleted: true}
                  - {code: closed, name: Закрыта, sortOrder: 6, isCompleted: true}
                taskTypes:
                  - {code: task, name: Задача}
                  - {code: bug, name: Ошибка}
                  - {code: improvement, name: Улучшение}
                  - {code: idea, name: Идея}
                  - {code: meeting, name: Встреча}
                roles:
                  - {code: admin, name: Администратор системы}
                  - {code: manager, name: Менеджер проекта}
                  - {code: member, name: Участник команды}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: Просмотреть роли и их права
      description: "UC-A7. Актор: администратор системы (право role.manage). Остальным ролям возвращается 403 (FR-10)."
      responses:
        '200':
          description: Роли с правами
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
              example:
                - {id: 1, code: admin, name: Администратор системы, permissions: [project.create, project.archive, project.delete, member.add, member.remove, task.create, task.assign, task.set_due_date, task.change_status, task.review, task.close, comment.create, role.manage]}
                - {id: 2, code: manager, name: Менеджер проекта, permissions: [project.create, project.archive, member.add, member.remove, task.create, task.assign, task.set_due_date, task.change_status, task.review, task.close, comment.create]}
                - {id: 3, code: member, name: Участник команды, permissions: [task.create, task.change_status, comment.create]}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RoleManageForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/permissions:
    get:
      tags: [roles]
      operationId: listPermissions
      summary: Просмотреть перечень прав
      description: "UC-A7. Актор: администратор системы."
      responses:
        '200':
          description: Права
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
              example:
                - {code: project.create, description: Создавать проекты}
                - {code: task.close, description: Закрывать задачу}
                - {code: role.manage, description: Настраивать права ролей}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RoleManageForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/roles/{roleId}/permissions:
    put:
      tags: [roles]
      operationId: replaceRolePermissions
      summary: Изменить права роли
      description: "UC-A8. Полностью заменяет набор прав роли. Изменения применяются при следующем действии пользователя (FR-09). У роли admin нельзя снять право role.manage."
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionsUpdate'
            example:
              permissions: [task.create, task.change_status, comment.create, task.set_due_date]
      responses:
        '200':
          description: Права роли обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
              example:
                id: 3
                code: member
                name: Участник команды
                permissions: [task.create, task.change_status, comment.create, task.set_due_date]
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RoleManageForbidden'
        '404':
          description: Роль не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errorCode: ROLE_NOT_FOUND
                message: Роль не найдена
                details: []
                traceId: 0d5e6f70-8192-4aa3-9e2f-3a4b5c6d7e8f
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Неизвестное право или попытка снять role.manage с администратора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unknownPermission:
                  value:
                    errorCode: UNKNOWN_PERMISSION
                    message: Указано неизвестное право
                    details: [{field: 'permissions[3]', reason: NOT_FOUND}]
                    traceId: 1e6f7081-92a3-4bb4-8f30-4b5c6d7e8f90
                adminLockout:
                  value:
                    errorCode: ADMIN_LOCKOUT
                    message: Нельзя снять право настройки ролей с администратора
                    details: [{field: permissions, reason: ROLE_MANAGE_REQUIRED}]
                    traceId: 2f708192-a3b4-4cc5-9041-5c6d7e8f9a01
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: Просмотреть список проектов
      description: "UC-P2. Проекты, в которых состоит пользователь (администратору доступны все). Архивные скрыты, доступны фильтром `archived=true` (FR-18)."
      parameters:
        - name: archived
          in: query
          description: Активные (false), архивные (true) или все (all)
          schema:
            type: string
            enum: ['false', 'true', all]
            default: 'false'
        - name: q
          in: query
          description: Поиск по названию
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница проектов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
              example:
                items:
                  - id: 7
                    name: Pinkmine Mobile
                    description: Android-клиент на Flutter
                    archived: false
                    archivedAt: null
                    createdBy: {id: 11, login: jessica, firstName: Джесика, lastName: Ковалёва, email: jessica@pinkmine.by}
                    createdAt: '2026-09-02T10:00:00Z'
                    myRole: manager
                    taskCounts: {new: 3, in_progress: 4, review: 1, postponed: 0, done: 5, closed: 9}
                page: 1
                size: 20
                total: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [projects]
      operationId: createProject
      summary: Создать проект
      description: "UC-P1. Актор: менеджер проекта (право project.create). Создатель становится менеджером проекта, рабочее пространство создаётся автоматически (FR-11)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
            example:
              name: Pinkmine Mobile
              description: Android-клиент на Flutter
      responses:
        '201':
          description: Проект создан
          headers:
            Location:
              description: Адрес созданного проекта
              schema:
                type: string
                example: /api/projects/7
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: 7
                name: Pinkmine Mobile
                description: Android-клиент на Flutter
                archived: false
                archivedAt: null
                createdBy: {id: 11, login: jessica, firstName: Джесика, lastName: Ковалёва, email: jessica@pinkmine.by}
                createdAt: '2026-10-21T09:00:00Z'
                myRole: manager
                taskCounts: {}
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет права project.create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errorCode: PROJECT_CREATE_FORBIDDEN
                message: Создавать проекты может менеджер проекта
                details: []
                traceId: 3a8192a3-b4c5-4dd6-8152-6d7e8f9a0b12
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}:
    get:
      tags: [projects]
      operationId: getProject
      summary: Открыть проект
      description: "UC-P2. Карточка проекта со счётчиками задач по статусам."
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Проект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: 7
                name: Pinkmine Mobile
                description: Android-клиент на Flutter
                archived: false
                archivedAt: null
                createdBy: {id: 11, login: jessica, firstName: Джесика, lastName: Ковалёва, email: jessica@pinkmine.by}
                createdAt: '2026-09-02T10:00:00Z'
                myRole: member
                taskCounts: {new: 3, in_progress: 4, review: 1, postponed: 0, done: 5, closed: 9}
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Удалить проект
      description: "UC-P10. Актор: администратор системы (право project.delete, FR-20). Удаляется только архивный проект вместе с задачами (H4)."
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: Проект удалён
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет права project.delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errorCode: PROJECT_DELETE_FORBIDDEN
                message: Удалить проект может только администратор системы
                details: []
                traceId: 4b92a3b4-c5d6-4ee7-9263-7e8f9a0b1c23
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: Проект не в архиве
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errorCode: PROJECT_NOT_ARCHIVED
