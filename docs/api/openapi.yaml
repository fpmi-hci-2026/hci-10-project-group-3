        '200':
          description: Теги проекта
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
              example:
                - {id: 3, name: android, color: '#3DDC84'}
                - {id: 4, name: web, color: '#1E88E5'}
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tags]
      operationId: createTag
      summary: Создать тег
      description: "UC-T13. Актор: менеджер проекта (право task.assign). Название уникально в проекте без учёта регистра."
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
