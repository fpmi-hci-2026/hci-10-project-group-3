    InvitationAcceptResult:
      type: object
      required: [projectId, role, joinedAt]
      properties:
        projectId:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/ProjectRoleCode'
        joinedAt:
          type: string
          format: date-time
    Tag:
      type: object
      required: [id, name, color]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
