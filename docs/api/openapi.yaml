    Device:
      type: object
      required: [id, platform, createdAt, lastSeenAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        platform:
          type: string
          enum: [android]
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
