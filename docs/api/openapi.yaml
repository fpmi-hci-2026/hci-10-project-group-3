                traceId: 90e7f809-1a2b-47dc-87c8-c7d8e9fa0b78
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен доступа из `POST /api/auth/login`
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Идентификатор проекта
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 7
    TaskId:
      name: taskId
      in: path
      required: true
      description: Идентификатор задачи
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 42
    UserId:
      name: userId
      in: path
      required: true
      description: Идентификатор пользователя
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 12
    RoleId:
      name: roleId
      in: path
      required: true
      description: Идентификатор роли
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 3
    CommentId:
      name: commentId
      in: path
      required: true
      description: Идентификатор комментария
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 118
    InviteToken:
      name: token
      in: path
      required: true
      description: Токен из ссылки приглашения
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
      example: inv_Hk3sP0qLw8ZtYb2cR5mN
    Page:
      name: page
      in: query
      description: Номер страницы
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  examples:
    ProjectArchived:
      summary: Проект в архиве
      value:
        errorCode: PROJECT_ARCHIVED
        message: Проект в архиве, изменение задач недоступно
        details: []
        traceId: 1f2e3d4c-5b6a-4978-8695-a4b3c2d1e0f9
    AssigneeNotMember:
      summary: Исполнитель не из проекта
      value:
        errorCode: ASSIGNEE_NOT_MEMBER
        message: Исполнителем может быть только участник проекта
        details: [{field: assigneeId, reason: NOT_PROJECT_MEMBER}]
        traceId: a1f8091a-2b3c-48ed-98d9-d8e9fa0b1c89
    DueDateInPast:
      summary: Срок в прошлом
      value:
        errorCode: DUE_DATE_IN_PAST
        message: Срок не может быть в прошлом
        details: [{field: dueDate, reason: BEFORE_TODAY}]
        traceId: b2091a2b-3c4d-49fe-89ea-e9fa0b1c2d9a
    TagNotInProject:
      summary: Тег из другого проекта
      value:
        errorCode: TAG_NOT_IN_PROJECT
        message: Тег не принадлежит проекту задачи
        details: [{field: 'tagIds[0]', reason: NOT_IN_PROJECT}]
        traceId: c31a2b3c-4d5e-4a0f-9afb-fa0b1c2d3eab
  responses:
    ValidationError:
      description: Некорректный JSON, тип, формат значения или лишнее поле
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: VALIDATION_ERROR
            message: Запрос содержит некорректные данные
            details: [{field: title, reason: REQUIRED}]
            traceId: d42b3c4d-5e6f-4b10-8b0c-0b1c2d3e4fbc
    Unauthorized:
      description: Нет токена, токен истёк или недействителен
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: UNAUTHORIZED
            message: Требуется авторизация
            details: []
            traceId: b2d6949c-60fa-4ef8-8a18-1bde451f7e7d
    UnsupportedMediaType:
      description: Content-Type не поддерживается
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: UNSUPPORTED_MEDIA_TYPE
            message: Неподдерживаемый формат запроса
            details: []
            traceId: e53c4d5e-6f70-4c21-9c1d-1c2d3e4f5acd
    InternalError:
      description: Непредвиденная ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: INTERNAL_ERROR
            message: Внутренняя ошибка сервера
            details: []
            traceId: 3c2b1a09-8f7e-4d6c-9b5a-4e3d2c1b0a9f
    TokenInvalid:
      description: Токен не найден, истёк или уже использован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: TOKEN_INVALID
            message: Ссылка недействительна или устарела
            details: [{field: token, reason: EXPIRED_OR_USED}]
            traceId: f64d5e6f-7081-4d32-8d2e-2d3e4f5a6bde
    RoleManageForbidden:
      description: Нет права role.manage (FR-10)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: ROLE_MANAGE_FORBIDDEN
            message: Раздел «Роли и права» доступен только администратору
            details: []
            traceId: 075e6f70-8192-4e43-9e3f-3e4f5a6b7cef
    MemberManageForbidden:
      description: Нет права member.add или member.remove
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: MEMBER_MANAGE_FORBIDDEN
            message: Управлять командой может менеджер проекта
            details: []
            traceId: 186f7081-92a3-4f54-8f40-4f5a6b7c8df0
    TagManageForbidden:
      description: Нет права task.assign
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: TAG_MANAGE_FORBIDDEN
            message: Управлять тегами может менеджер проекта
            details: []
            traceId: 29708192-a3b4-4065-8051-5a6b7c8d9e01
    CommentForbidden:
      description: Нет права comment.create
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: COMMENT_FORBIDDEN
            message: Недостаточно прав для комментирования
            details: []
            traceId: 3a8192a3-b4c5-4176-8162-6b7c8d9e0f12
    CommentNotAuthor:
      description: Изменять и удалять комментарий может только автор
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: COMMENT_NOT_AUTHOR
            message: Изменить комментарий может только его автор
            details: []
            traceId: 4b92a3b4-c5d6-4287-9273-7c8d9e0f1a23
    ProjectNotFound:
      description: Проект не найден или пользователь не состоит в нём
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: PROJECT_NOT_FOUND
            message: Проект не найден
            details: []
            traceId: 5ca3b4c5-d6e7-4398-8384-8d9e0f1a2b34
    TaskNotFound:
      description: Задача не найдена или пользователь не состоит в её проекте
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: TASK_NOT_FOUND
            message: Задача не найдена
            details: []
            traceId: 4e7a2b1c-8d3f-4a6e-b5c9-1d2e3f4a5b6c
    CommentNotFound:
      description: Комментарий не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: COMMENT_NOT_FOUND
            message: Комментарий не найден
            details: []
            traceId: 6db4c5d6-e7f8-44a9-9495-9e0f1a2b3c45
    InviteNotFound:
      description: Приглашение не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: INVITE_NOT_FOUND
            message: Приглашение не найдено
            details: []
            traceId: 7ec5d6e7-f809-45ba-85a6-0f1a2b3c4d56
    InviteGone:
      description: Приглашение истекло, отозвано или уже принято другим пользователем (FR-17)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: INVITE_EXPIRED
            message: Приглашение недействительно, обратитесь к менеджеру проекта
            details: []
            traceId: 8fd6e7f8-091a-46cb-96b7-1a2b3c4d5e67
    TaskConflict:
      description: Версия устарела (H3, FR-31) или проект в архиве (FR-19)
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/VersionConflictError'
              - $ref: '#/components/schemas/Error'
          examples:
            versionConflict:
              summary: Задача изменена другим пользователем
              value:
                errorCode: TASK_VERSION_CONFLICT
                message: Задача изменена другим пользователем
                details: [{field: version, reason: STALE_VERSION}]
                traceId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                current:
                  id: 42
                  projectId: 7
                  title: Экран «Мои задачи»
                  description: null
                  status: review
                  type: task
                  author: {id: 11, login: jessica, firstName: Джесика, lastName: Ковалёва, email: jessica@pinkmine.by}
                  assignee: {id: 12, login: ryan, firstName: Райан, lastName: Мельник, email: ryan@pinkmine.by}
                  dueDate: '2026-10-25'
                  overdue: false
                  tags: []
                  version: 5
                  createdAt: '2026-10-14T07:00:00Z'
                  updatedAt: '2026-10-21T08:15:00Z'
            projectArchived:
              $ref: '#/components/examples/ProjectArchived'
  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
      example: 42
    TaskStatusCode:
      type: string
      description: Код статуса задачи (task_statuses.code)
      enum: [new, in_progress, review, postponed, done, closed]
    TaskTypeCode:
      type: string
      description: Код типа задачи (task_types.code)
      enum: [task, bug, improvement, idea, meeting]
    RoleCode:
      type: string
      description: Код глобальной роли (roles.code)
      enum: [admin, manager, member]
    ProjectRoleCode:
      type: string
      description: Роль в проекте (project_members.role_id)
      enum: [manager, member]
    PermissionCode:
      type: string
      description: Код права (permissions.code)
      enum: [project.create, project.archive, project.delete, member.add, member.remove, task.create, task.assign, task.set_due_date, task.change_status, task.review, task.close, comment.create, role.manage]
    Error:
      type: object
      required: [errorCode, message, details, traceId]
      properties:
        errorCode:
          type: string
          description: Машиночитаемый код ошибки
          example: VALIDATION_ERROR
        message:
          type: string
          description: Сообщение для пользователя
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        traceId:
          type: string
          format: uuid
          description: Идентификатор запроса в журналах сервера
    ErrorDetail:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          description: JSON path поля
          example: title
        reason:
          type: string
          example: REQUIRED
    VersionConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [current]
          properties:
            current:
              $ref: '#/components/schemas/Task'
    UserShort:
      type: object
      required: [id, login, firstName, lastName, email]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        login:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
    UserProfile:
      type: object
      required: [id, login, email, firstName, lastName, role, emailConfirmed, permissions, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        login:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/RoleCode'
        emailConfirmed:
          type: boolean
          description: false — в профиле показывается баннер «Подтвердите email» (FR-04)
        permissions:
          type: array
          description: Права глобальной роли
          items:
            $ref: '#/components/schemas/PermissionCode'
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [login, email, password, firstName, lastName]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[A-Za-z0-9_.-]+$'
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Не менее 8 символов (FR-03)
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        inviteToken:
          type: string
          minLength: 16
          maxLength: 128
          description: Токен приглашения, если регистрация начата по ссылке (FR-17)
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 128
    EmailConfirmResult:
      type: object
      required: [emailConfirmed, emailConfirmedAt]
      properties:
        emailConfirmed:
          type: boolean
        emailConfirmedAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: Логин или email
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Время жизни токена в секундах
        user:
          $ref: '#/components/schemas/UserProfile'
    PasswordForgotRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 128
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    MessageResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
    DictionaryItem:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    TaskStatusItem:
      type: object
      required: [code, name, sortOrder, isCompleted]
      properties:
        code:
          $ref: '#/components/schemas/TaskStatusCode'
        name:
          type: string
        sortOrder:
          type: integer
          description: Порядок колонки Канбан-доски
        isCompleted:
          type: boolean
          description: done и closed — завершённые
    Dictionaries:
      type: object
      required: [taskStatuses, taskTypes, roles]
      properties:
        taskStatuses:
          type: array
          items:
            $ref: '#/components/schemas/TaskStatusItem'
        taskTypes:
          type: array
          items:
            $ref: '#/components/schemas/DictionaryItem'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/DictionaryItem'
    Permission:
      type: object
      required: [code, description]
      properties:
        code:
          $ref: '#/components/schemas/PermissionCode'
        description:
          type: string
    Role:
      type: object
      required: [id, code, name, permissions]
      properties:
        id:
          type: integer
          format: int32
        code:
          $ref: '#/components/schemas/RoleCode'
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionCode'
    RolePermissionsUpdate:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z_.]+$'
    Project:
      type: object
      required: [id, name, description, archived, archivedAt, createdBy, createdAt, myRole, taskCounts]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: string
          nullable: true
        archived:
          type: boolean
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          $ref: '#/components/schemas/UserShort'
        createdAt:
          type: string
          format: date-time
        myRole:
          type: string
          nullable: true
          enum: [manager, member, null]
          description: Роль текущего пользователя в проекте (null для администратора вне команды)
        taskCounts:
          type: object
          description: Количество задач по кодам статусов
          additionalProperties:
            type: integer
            minimum: 0
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          nullable: true
    ProjectArchiveRequest:
      type: object
      additionalProperties: false
      required: [archived]
      properties:
        archived:
          type: boolean
    ProjectPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
    Member:
      type: object
      required: [user, role, joinedAt]
      properties:
        user:
          $ref: '#/components/schemas/UserShort'
        role:
          $ref: '#/components/schemas/ProjectRoleCode'
        joinedAt:
          type: string
          format: date-time
    MemberAdd:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/ProjectRoleCode'
    Invitation:
      type: object
      required: [id, email, role, invitedBy, createdAt, expiresAt, state]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/ProjectRoleCode'
        invitedBy:
          $ref: '#/components/schemas/UserShort'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: created_at + 7 дней (H1)
        state:
          type: string
          enum: [active, accepted, revoked, expired]
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/ProjectRoleCode'
    InvitationPreview:
      type: object
      required: [projectId, projectName, email, role, invitedBy, expiresAt, userExists]
      properties:
        projectId:
          $ref: '#/components/schemas/Id'
        projectName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/ProjectRoleCode'
        invitedBy:
          type: object
          required: [firstName, lastName]
          properties:
            firstName:
              type: string
            lastName:
              type: string
        expiresAt:
          type: string
          format: date-time
