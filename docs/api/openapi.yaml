          $ref: '#/components/responses/TaskNotFound'
        '409':
          description: Проект в архиве
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                projectArchived:
                  $ref: '#/components/examples/ProjectArchived'
        '413':
          description: Файл больше 20 МБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errorCode: FILE_TOO_LARGE
                message: Размер файла не должен превышать 20 МБ
                details: [{field: file, reason: MAX_SIZE_20MB}]
                traceId: 5ca3b4c5-d6e7-43f8-8384-e3f4a5b6c734
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
