    TaskStatusResult:
      type: object
      required: [id, projectId, status, version, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/TaskStatusCode'
        version:
          type: integer
          format: int32
        updatedAt:
          type: string
          format: date-time
    TaskAssigneeUpdate:
      type: object
      additionalProperties: false
