        author:
          $ref: '#/components/schemas/UserShort'
        assignee:
          allOf:
            - $ref: '#/components/schemas/UserShort'
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        overdue:
          type: boolean
          description: Вычисляется, хранится только факт уведомления (FR-51)
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        version:
          type: integer
          format: int32
